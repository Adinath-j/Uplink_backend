# Server Port & Binding (Render injects PORT dynamically)
server.address=0.0.0.0
server.port=${PORT:8080}

# Force immediate initialization of DispatcherServlet to prevent Render port scan timeout
spring.mvc.servlet.load-on-startup=1

# Supabase PostgreSQL
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.h2.console.enabled=false

# Connection Pooling (tuned for Render + Supabase pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Writable upload path inside Render container
file.upload-dir=/tmp/uploads
uplink.storage.upload-dir=/tmp/uploads

# Skip Hibernate schema diffing against Supabase (tables already exist)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Create beans only when first needed instead of all at boot
spring.main.lazy-initialization=true

# Stop Spring Data Redis from scanning all 41 JPA repositories
spring.data.redis.repositories.enabled=false

# Disable unused JMX overhead
spring.jmx.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# GZIP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
